---
Description: Everything to make deployments by GitHub Actions possible
Parameters:
  SubjectClaimFilters:
    Type: CommaDelimitedList
    Default: "repo:RobKenis/rob-kenis-dot-com:ref:refs/heads/master"
  AudienceList:
    Type: CommaDelimitedList
    Default: sts.amazonaws.com

Resources:
  GitHubActionsServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RoleForGitHubActions
            Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action:
              - "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": !Ref AudienceList
              StringLike:
                "token.actions.githubusercontent.com:sub": !Ref SubjectClaimFilters
      Description: Service Role for use in GitHub Actions
      Path: "/"
      Tags:
        - Key: Project
          Value: rob-kenis-dot-com
      Policies:
        - PolicyName: ManageResourcesForGitHubActions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "cloudformation:*"
                  - "acm:*"
                  - "route53:*"
                  - "s3:*"
                  - "cloudfront:*"
                Resource: "*"

Outputs:
  ServiceRoleARN:
    Description: ARN of service role for use in GitHub actions
    Value: !GetAtt GitHubActionsServiceRole.Arn
